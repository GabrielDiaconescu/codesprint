id: 99d03e20-2ae2-48b7-b027-5d1ba3c0d9d2
slug: copying-lists
title:
  en: Two names, one list
summary:
  en: Why changing one list can change "another", and how to make a real copy.
estimated_minutes: 6
review_status: draft

blocks:
  - type: text
    body:
      en: |
        Assigning a list to a second name does **not** copy it. Both names now point at the
        same list, so a change made through either name shows up through both.

  - type: code
    code: |
      a = [1, 2]
      b = a
      b.append(3)
      print(a)
    output: '[1, 2, 3]'
    runnable: true
    caption:
      en: Nothing was appended to `a` — and yet `a` changed, because `a` and `b` are the same list.

  - type: text
    body:
      en: |
        When you want an independent list, ask for a copy. `a.copy()` and the full slice
        `a[:]` both build a new list with the same items.

  - type: code
    code: |
      a = [1, 2]
      b = a.copy()
      b.append(3)
      print(a)
      print(b)
    output: |-
      [1, 2]
      [1, 2, 3]
    runnable: true

  - type: text
    body:
      en: |
        Slicing a list works exactly as it does for strings, and always gives a new list.

  - type: code
    code: |
      nums = [10, 20, 30, 40]
      print(nums[1:3])
    output: '[20, 30]'
    runnable: true

  - type: callout
    variant: mistake
    body:
      en: |
        When a list seems to change on its own, look for a second name pointing at it. This
        is one of the most common bugs in Python programs of every size.

  - type: question
    question:
      id: 6fb452f6-4590-4b8b-8cc4-ca594028f2bb
      type: multiple_choice
      difficulty: easy
      prompt:
        en: With `nums = [10, 20, 30, 40]`, what is `nums[1:3]`?
      payload:
        options:
          - id: right
            text:
              en: '[20, 30]'
          - id: from-start
            text:
              en: '[10, 20, 30]'
          - id: to-end
            text:
              en: '[20, 30, 40]'
          - id: single
            text:
              en: '[20]'
      answer:
        option_id: right
      explanation:
        en: >
          From index 1 up to, but not including, index 3 — the second and third items.
      skill_tags: [lists, slicing]
      review_status: draft

  - type: question
    question:
      id: 58084b0f-f972-4d9a-afbc-2064c4ae9f40
      type: true_false
      difficulty: easy
      prompt:
        en: After `b = a`, where `a` is a list, appending to `b` also changes `a`.
      answer:
        value: true
      explanation:
        en: >
          `b = a` gives the same list a second name. There is only one list, so every change
          shows up under both names.
      skill_tags: [lists]
      review_status: draft

  - type: question
    question:
      id: a4bc30c9-aa01-4958-aa02-bf753b3c7a08
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        a = [1, 2]
        b = a
        b[0] = 99
        print(a)
      payload:
        input: choice
        options:
          - id: shared
            text:
              en: '[99, 2]'
          - id: untouched
            text:
              en: '[1, 2]'
          - id: both
            text:
              en: '[99, 1, 2]'
          - id: error
            text:
              en: A NameError
      answer:
        value: '[99, 2]'
        match_mode: exact
      explanation:
        en: >
          `a` and `b` are one list with two names. Replacing the first item through `b`
          replaces it for `a` too.
      skill_tags: [lists]
      review_status: draft

  - type: question
    question:
      id: cb5e85b0-e114-44a1-b71e-669fa367670c
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        a = [1, 2]
        b = a[:]
        b.append(3)
        print(a)
      payload:
        input: choice
        options:
          - id: untouched
            text:
              en: '[1, 2]'
          - id: shared
            text:
              en: '[1, 2, 3]'
          - id: empty
            text:
              en: '[]'
          - id: only-three
            text:
              en: '[3]'
      answer:
        value: '[1, 2]'
        match_mode: exact
      explanation:
        en: >
          `a[:]` is a slice of the whole list, and a slice is always a new list. So `b` is a
          separate copy, and appending to it leaves `a` alone.
      skill_tags: [lists, slicing]
      review_status: draft

  - type: question
    question:
      id: a876a506-1be3-4e01-ab50-606e234229ee
      type: concept_matching
      difficulty: hard
      prompt:
        en: Match each line to what `b` ends up being.
      payload:
        concepts:
          - id: alias
            text:
              en: b = a
          - id: copy
            text:
              en: b = a.copy()
          - id: tail
            text:
              en: b = a[1:]
        definitions:
          - id: same
            text:
              en: The same list as a, under a second name
          - id: separate
            text:
              en: A separate list with all of a's items
          - id: shorter
            text:
              en: A new list without a's first item
      answer:
        pairs:
          alias: same
          copy: separate
          tail: shorter
      explanation:
        en: >
          Only plain assignment shares the list. Both `copy()` and a slice build a new list,
          so later changes to `b` stay in `b`.
      skill_tags: [lists, slicing]
      review_status: draft
