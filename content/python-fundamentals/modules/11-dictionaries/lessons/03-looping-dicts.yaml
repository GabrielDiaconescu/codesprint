id: a6c884c2-5be0-421f-8d45-3357817d3e3c
slug: looping-dicts
title:
  en: Going through a dictionary
summary:
  en: Looping over keys, over key-value pairs with items(), and over values alone.
estimated_minutes: 6
review_status: draft

blocks:
  - type: text
    body:
      en: |
        A `for` loop over a dictionary gives you its **keys**, in the order they were added.

  - type: code
    code: |
      ages = {"Ann": 31, "Bo": 25}
      for name in ages:
          print(name)
    output: |-
      Ann
      Bo
    runnable: true

  - type: text
    body:
      en: |
        When you need both halves, loop over `items()`. Each round hands you a key and its
        value, which you unpack into two names.

  - type: code
    code: |
      ages = {"Ann": 31, "Bo": 25}
      for name, age in ages.items():
          print(f"{name}: {age}")
    output: |-
      Ann: 31
      Bo: 25
    runnable: true

  - type: text
    body:
      en: |
        `values()` gives just the values — handy with `sum`, `max` and friends.

  - type: code
    code: |
      ages = {"Ann": 31, "Bo": 25}
      print(sum(ages.values()))
    output: '56'
    runnable: true

  - type: callout
    variant: note
    body:
      en: |
        Dictionaries remember the order entries were added in, so looping over one always
        gives the same order. That has been guaranteed since Python 3.7.

  - type: question
    question:
      id: 21af6227-413b-4389-8255-33cccdfc3a2f
      type: multiple_choice
      difficulty: easy
      prompt:
        en: What does `for k in d:` give you on each round?
      payload:
        options:
          - id: keys
            text:
              en: The keys
          - id: values
            text:
              en: The values
          - id: pairs
            text:
              en: Key-value pairs
          - id: positions
            text:
              en: Positions 0, 1, 2 and so on
      answer:
        option_id: keys
      explanation:
        en: >
          Looping over a dictionary walks its keys. Use `items()` for pairs and `values()` for
          values.
      skill_tags: [dictionaries, loops]
      review_status: draft

