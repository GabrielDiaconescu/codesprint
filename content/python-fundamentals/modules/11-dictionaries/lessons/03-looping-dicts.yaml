  - type: question
    question:
      id: 7b054955-2c11-46c1-b527-098a2c9b8499
      type: predict_output
      difficulty: hard
      prompt:
        en: What does this print?
      code_snippet: |
        stock = {"tea": 0, "cake": 3, "jam": 0}
        empty = 0
        for item, qty in stock.items():
            if qty == 0:
                empty += 1
        print(empty)
      payload:
        input: text
      answer:
        value: '2'
        match_mode: trimmed
      explanation:
        en: >
          The loop visits every pair and counts the ones whose quantity is 0: tea and jam.
      hint:
        en: Check each quantity in turn.
      skill_tags: [dictionaries, loops, accumulators]
      review_status: draft
