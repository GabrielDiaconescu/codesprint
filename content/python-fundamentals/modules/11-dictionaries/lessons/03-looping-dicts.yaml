        options:
          - id: repeated
            text:
              en: "x\nyy"
          - id: numbers
            text:
              en: "1\n4"
          - id: once
            text:
              en: "x\ny"
          - id: error
            text:
              en: A TypeError
      answer:
        value: "x\nyy"
        match_mode: exact
      explanation:
        en: >
          Each round unpacks a key and its value. A string times a number repeats it: "x" once,
          then "y" twice.
      skill_tags: [dictionaries, loops, unpacking]
      review_status: draft

  - type: question
    question:
      id: 3084efe9-1c6e-46a3-a44b-8564a33b997b
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        prices = {"a": 3, "b": 4}
        print(sum(prices.values()))
      payload:
        input: text
      answer:
        value: '7'
        match_mode: trimmed
      explanation:
        en: >
          `values()` gives 3 and 4, and `sum` adds them. Summing the dictionary itself would
          try to add up the keys.
      skill_tags: [dictionaries]
      review_status: draft

  - type: question
    question:
      id: 5325e94f-7f03-41b9-a0f1-5edd53c603da
      type: concept_matching
      difficulty: medium
      prompt:
        en: Match each method to what it gives you.
      payload:
        concepts:
          - id: keys
            text:
              en: d.keys()
          - id: values
            text:
              en: d.values()
          - id: items
            text:
              en: d.items()
        definitions:
          - id: just-keys
            text:
              en: Just the keys
          - id: just-values
            text:
              en: Just the values
          - id: pairs
            text:
              en: Each key together with its value
      answer:
        pairs:
          keys: just-keys
          values: just-values
          items: pairs
      explanation:
        en: >
          The names say it: keys, values, and items — an item being one key-value pair.
      skill_tags: [dictionaries]
