  - type: question
    question:
      id: 17d36542-6e97-4216-8398-2566ee549099
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        d = {"x": 1, "y": 2}
        for k, v in d.items():
            print(k * v)
      payload:
