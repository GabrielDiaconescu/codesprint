id: 5d8046f6-19c2-4eba-80c7-175d05b38e6e
slug: set-operations
title:
  en: Combining sets
summary:
  en: Union, intersection and difference — in either, in both, in one but not the other.
estimated_minutes: 6
review_status: draft

blocks:
  - type: text
    body:
      en: |
        Sets can be combined like the circles in a Venn diagram. `a | b` is everything in
        either set, `a & b` is only what is in both, and `a - b` is what is in `a` but not in
        `b`.

  - type: code
    code: |
      a = {1, 2, 3}
      b = {2, 3, 4}
      print(sorted(a | b))
      print(sorted(a & b))
      print(sorted(a - b))
    output: |-
      [1, 2, 3, 4]
      [2, 3]
      [1]
    runnable: true

  - type: text
    body:
      en: |
        These turn questions about groups into one line each. Who is friends with both Ann and
        Eve?

  - type: code
    code: |
      ann = {"Bo", "Cy", "Di"}
      eve = {"Cy", "Di", "Fi"}
      print(sorted(ann & eve))
    output: "['Cy', 'Di']"
    runnable: true

  - type: callout
    variant: tip
    body:
      en: |
        `|` and `&` give the same result either way round, but `-` does not: `a - b` and
        `b - a` are usually different sets.

  - type: question
    question:
      id: 3ee0ecbd-c02d-4f6f-9625-273639d9d6bb
      type: concept_matching
      difficulty: easy
      prompt:
        en: Match each operation to what it keeps.
      payload:
        concepts:
          - id: union
            text:
              en: a | b
          - id: intersection
            text:
              en: a & b
          - id: difference
            text:
              en: a - b
        definitions:
          - id: either
            text:
              en: Everything in either set
          - id: both
            text:
              en: Only what is in both sets
          - id: first-only
            text:
              en: What is in a but not in b
      answer:
        pairs:
          union: either
          intersection: both
          difference: first-only
      explanation:
        en: >
          Union joins, intersection keeps the overlap, and difference takes away what the
          second set has.
      skill_tags: [sets]
      review_status: draft

  - type: question
    question:
      id: 46141c3f-3006-4fb1-9ce7-f30866142419
      type: predict_output
      difficulty: easy
      prompt:
        en: What does this print?
      code_snippet: |
        print(sorted({1, 2} | {2, 3}))
      payload:
        input: choice
        options:
          - id: union
            text:
              en: '[1, 2, 3]'
          - id: duplicated
            text:
              en: '[1, 2, 2, 3]'
          - id: overlap
            text:
              en: '[2]'
          - id: difference
            text:
              en: '[1]'
      answer:
        value: '[1, 2, 3]'
        match_mode: exact
      explanation:
        en: >
          The union holds everything from both sets, and 2 appears only once because it is
          still a set.
      skill_tags: [sets]
      review_status: draft

  - type: question
    question:
      id: ccad9325-f95b-45c6-b9bd-c118cd3ccce2
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        print(sorted({1, 2, 3} & {3, 4}))
      payload:
        input: choice
        options:
          - id: overlap
            text:
              en: '[3]'
          - id: union
            text:
              en: '[1, 2, 3, 4]'
          - id: difference
            text:
              en: '[1, 2]'
          - id: empty
            text:
              en: '[]'
      answer:
        value: '[3]'
        match_mode: exact
      explanation:
        en: >
          `&` keeps only values found in both sets, and 3 is the only one.
      skill_tags: [sets]
      review_status: draft

  - type: question
    question:
      id: 97683c03-50ed-42c9-82dc-f88b9aee978c
      type: true_false
      difficulty: medium
      prompt:
        en: '`{1, 2, 3} - {3, 4}` gives the same set as `{3, 4} - {1, 2, 3}`.'
      answer:
        value: false
      explanation:
        en: >
          The first is `{1, 2}` — what the first set has that the second lacks. The second is
          `{4}`. Difference depends on which set comes first.
      skill_tags: [sets]
      review_status: draft

  - type: question
    question:
      id: dbb03cad-1331-4f1d-afa7-3692410110e0
      type: multiple_choice
      difficulty: medium
      prompt:
        en: '`chess` and `art` are sets of student names. Which finds the students in both clubs?'
      payload:
        options:
          - id: and
            text:
              en: chess & art
          - id: or
            text:
              en: chess | art
          - id: minus
            text:
              en: chess - art
          - id: plus
            text:
              en: chess + art
      answer:
        option_id: and
      explanation:
        en: >
          "In both" is the intersection, `&`. The union would include students in only one
          club, and sets do not support `+` at all.
      skill_tags: [sets]
      review_status: draft

  - type: question
    question:
      id: d90b0b91-d76d-40cf-8be8-a26fd895ff53
      type: predict_output
      difficulty: hard
      prompt:
        en: What does this print?
      code_snippet: |
        a = {1, 2, 3, 4}
        b = {3, 4, 5}
        print(len(a - b) + len(b - a))
      payload:
        input: text
      answer:
        value: '3'
        match_mode: trimmed
      explanation:
        en: >
          `a - b` is {1, 2} and `b - a` is {5}. Together that is 3 values that belong to only
          one of the two sets.
      hint:
        en: Work out each difference separately.
      skill_tags: [sets]
      review_status: draft
