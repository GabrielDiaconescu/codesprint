id: d09cc47b-e32a-447b-af4a-5f7da1b4977a
slug: break-and-continue
title:
  en: Leaving early and skipping ahead
summary:
  en: break to stop a loop at once, continue to skip the rest of one round.
estimated_minutes: 7
review_status: draft

blocks:
  - type: text
    body:
      en: |
        Two keywords change the flow of a loop from inside. `break` leaves the loop
        immediately. `continue` skips the rest of the current round and moves on to the next.

  - type: code
    code: |
      for n in range(1, 10):
          if n == 4:
              break
          print(n)
    output: |-
      1
      2
      3
    runnable: true
    caption:
      en: At 4 the loop ends — 4 and everything after it are never printed.

  - type: code
    code: |
      for n in range(1, 6):
          if n % 2 == 0:
              continue
          print(n)
    output: |-
      1
      3
      5
    runnable: true
    caption:
      en: Even numbers skip the print, but the loop carries on with the next number.

  - type: text
    body:
      en: |
        `break` is how you stop searching once you have found what you were looking for —
        there is no point checking the rest.

  - type: code
    code: |
      for ch in "python":
          if ch == "h":
              print("found h")
              break
    output: 'found h'
    runnable: true

  - type: callout
    variant: tip
    body:
      en: |
        `while True:` with a `break` inside is a common shape when the moment to stop is only
        known halfway through a round.

  - type: question
    question:
      id: c626273c-c3e8-4428-a119-f7d256b1634b
      type: multiple_choice
      difficulty: easy
      prompt:
        en: What does `break` do inside a loop?
      payload:
        options:
          - id: leave
            text:
              en: Leaves the loop immediately
          - id: skip
            text:
              en: Skips to the next round
          - id: stop-program
            text:
              en: Stops the whole program
          - id: restart
            text:
              en: Starts the loop again from the beginning
      answer:
        option_id: leave
      explanation:
        en: >
          `break` ends the loop at once, and the program continues with the first line after
          the loop. Skipping to the next round is what `continue` does.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: eee7d121-1792-4e1e-bc88-b38c8f9a6a4b
      type: true_false
      difficulty: easy
      prompt:
        en: '`continue` ends the loop completely.'
      answer:
        value: false
      explanation:
        en: >
          `continue` only abandons the current round. The loop goes on with the next value.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: 5c6fdd65-46d2-4e29-acfc-f182291d9ceb
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        for i in range(5):
            if i == 2:
                continue
            print(i)
      payload:
        input: choice
        options:
          - id: skips-two
            text:
              en: "0\n1\n3\n4"
          - id: stops
            text:
              en: "0\n1"
          - id: all
            text:
              en: "0\n1\n2\n3\n4"
          - id: only-two
            text:
              en: '2'
      answer:
        value: "0\n1\n3\n4"
        match_mode: exact
      explanation:
        en: >
          When `i` is 2, `continue` skips the print for that round only. Every other value is
          printed.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: ce805186-f9a0-4471-8b6f-92e7ec47947b
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        for i in range(5):
            if i == 2:
                break
            print(i)
      payload:
        input: choice
        options:
          - id: stops
            text:
              en: "0\n1"
          - id: includes-two
            text:
              en: "0\n1\n2"
          - id: skips-two
            text:
              en: "0\n1\n3\n4"
          - id: nothing
            text:
              en: Nothing at all
      answer:
        value: "0\n1"
        match_mode: exact
      explanation:
        en: >
          At 2 the loop ends before the print, so only 0 and 1 appear. Compare this with the
          `continue` version: one word changes the whole result.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: f0eb7171-62b7-4496-aa8f-c9cda46bec06
      type: concept_matching
      difficulty: medium
      prompt:
        en: Match each one to what it does.
      payload:
        concepts:
          - id: break
            text:
              en: break
          - id: continue
            text:
              en: continue
          - id: false-condition
            text:
              en: A while condition turning False
        definitions:
          - id: leave-now
            text:
              en: Leaves the loop at once, in the middle of a round
          - id: next-round
            text:
              en: Skips the rest of this round and starts the next
          - id: ends-at-check
            text:
              en: Ends the loop the next time the condition is checked
      answer:
        pairs:
          break: leave-now
          continue: next-round
          false-condition: ends-at-check
      explanation:
        en: >
          `break` and `continue` act the moment they run. A condition only matters when it is
          checked, which is at the top of each round.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: db033ab0-235a-451f-835b-7169b7d17456
      type: predict_output
      difficulty: hard
      prompt:
        en: What does this print?
      code_snippet: |
        n = 0
        while True:
            n += 3
            if n > 10:
                break
        print(n)
      payload:
        input: text
      answer:
        value: '12'
        match_mode: trimmed
      explanation:
        en: >
          `n` goes 3, 6, 9, 12. The check happens after each addition, so the loop only breaks
          once `n` has already passed 10 — at 12, not at 9.
      hint:
        en: Is the check before or after `n` grows?
      skill_tags: [loops]
      review_status: draft
