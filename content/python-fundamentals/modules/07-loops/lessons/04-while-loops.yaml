id: 14558780-0061-4706-8700-39d8d24f1dfd
slug: while-loops
title:
  en: Repeating while something is true
summary:
  en: while loops, when to use them, and how to avoid a loop that never ends.
estimated_minutes: 6
review_status: draft

blocks:
  - type: text
    body:
      en: |
        A `while` loop repeats its block for as long as its condition stays True. The
        condition is checked before every round, including the first.

  - type: code
    code: |
      n = 3
      while n > 0:
          print(n)
          n -= 1
      print("Liftoff")
    output: |-
      3
      2
      1
      Liftoff
    runnable: true

  - type: text
    body:
      en: |
        Use `while` when you do not know in advance how many rounds you need — only when to
        stop. Here the loop keeps doubling until the number passes 100.

  - type: code
    code: |
      n = 1
      while n < 100:
          n = n * 2
      print(n)
    output: '128'
    runnable: true

  - type: callout
    variant: mistake
    body:
      en: |
        Something inside the loop has to move the condition towards False. Forget `n -= 1`
        in the first example and the condition stays True forever — an **infinite loop** that
        only stops when the program is forced to quit.

  - type: question
    question:
      id: ede2ad3a-f487-4ddb-8b72-4cf5e4152362
      type: true_false
      difficulty: easy
      prompt:
        en: A `while` loop checks its condition before every round.
      answer:
        value: true
      explanation:
        en: >
          Including the very first one — so if the condition starts out False, the block never
          runs at all.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: 2824bcbe-710d-40cf-850a-223a6bc5a084
      type: multiple_choice
      difficulty: easy
      prompt:
        en: What makes a `while` loop stop?
      payload:
        options:
          - id: condition
            text:
              en: Its condition becoming False
          - id: file-end
            text:
              en: Reaching the end of the file
          - id: ten
            text:
              en: Running ten times
          - id: print
            text:
              en: Calling print
      answer:
        option_id: condition
      explanation:
        en: >
          A `while` loop has no built-in limit. It runs until its condition is False when it is
          checked.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: 52727a5b-e83b-427e-820c-86e61ced685f
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        n = 1
        while n <= 3:
            print(n)
            n += 1
      payload:
        input: choice
        options:
          - id: right
            text:
              en: "1\n2\n3"
          - id: from-zero
            text:
              en: "0\n1\n2"
          - id: short
            text:
              en: "1\n2"
          - id: long
            text:
              en: "1\n2\n3\n4"
      answer:
        value: "1\n2\n3"
        match_mode: exact
      explanation:
        en: >
          1, 2 and 3 all satisfy `n <= 3`. After printing 3, `n` becomes 4, the check fails, and
          the loop ends.
      skill_tags: [loops]
      review_status: draft

  - type: question
    question:
      id: 9b9757f7-7788-4f74-92ee-8acdd2cfe07b
      type: predict_output
      difficulty: medium
      prompt:
        en: How many times is 10 halved before it reaches 1? What does this print?
      code_snippet: |
        x = 10
        count = 0
        while x > 1:
            x = x // 2
            count += 1
        print(count)
      payload:
        input: text
      answer:
        value: '3'
        match_mode: trimmed
      explanation:
        en: >
          10 becomes 5, then 2, then 1. That is three rounds; at 1 the condition `x > 1` fails
          and the loop stops.
      hint:
        en: Write down `x` after each round.
      skill_tags: [loops, accumulators]
      review_status: draft

  - type: question
    question:
      id: 30e1653f-1bfe-4781-b351-93ad9e2c9ec7
      type: multiple_select
      difficulty: hard
      prompt:
        en: Which of these loops would never stop on their own?
      payload:
        options:
          - id: grows
            text:
              en: n starts at 1; the loop runs while n > 0 and adds 1 each round
          - id: reaches
            text:
              en: n starts at 1; the loop runs while n < 5 and adds 1 each round
          - id: skips
            text:
              en: n starts at 1; the loop runs while n != 10 and adds 2 each round
          - id: passes
            text:
              en: n starts at 10; the loop runs while n > 0 and subtracts 3 each round
          - id: forever
            text:
              en: The loop runs while True and only prints
      answer:
        option_ids: [grows, skips, forever]
      explanation:
        en: >
          The first moves away from its stopping point. The third goes 1, 3, 5, 7, 9, 11 — it
          jumps straight over 10, so `n != 10` stays True. `while True` never becomes False.
          The other two reach their stopping points.
      hint:
        en: For each one, ask whether n ever makes the condition False.
      skill_tags: [loops]
      review_status: draft
