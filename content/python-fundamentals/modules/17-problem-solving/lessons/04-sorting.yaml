  - type: question
    question:
      id: 5c036228-c9d9-4dd9-aa79-0ded7be58b33
      type: debugging
      difficulty: medium
      prompt:
        en: This should sort the words by length but stops with a TypeError. Which line is the problem?
      code_snippet: |
        words = ["pear", "fig", "apple"]
        print(sorted(words, key=len()))
      payload:
        mode: select_line
        lines:
          - id: words
            text: 'words = ["pear", "fig", "apple"]'
          - id: sort
            text: 'print(sorted(words, key=len()))'
      answer:
        line_id: sort
      runnable: true
      fixed_code: |
        words = ["pear", "fig", "apple"]
        print(sorted(words, key=len))
      fixed_output: "['fig', 'pear', 'apple']"
      explanation:
        en: >
          `len()` calls the function immediately, with nothing to measure. `key` needs the
          function itself — `key=len` — so `sorted` can call it on each word.
      hint:
        en: Should the function be called here, or handed over?
      skill_tags: [sorting, functions, debugging]
      review_status: draft

