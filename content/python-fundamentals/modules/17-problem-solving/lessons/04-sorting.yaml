id: 9c569460-bf7e-4954-a766-a690a521a17e
slug: sorting
title:
  en: How sorting works, and sorting by anything
summary:
  en: Selection sort by hand, then sorted() with a key function to choose what to sort by.
estimated_minutes: 8
review_status: draft

blocks:
  - type: text
    body:
      en: |
        `sorted()` does the work for you, but seeing one sort built by hand shows what it
        involves. **Selection sort** repeatedly finds the smallest remaining item and swaps
        it to the front.

  - type: code
    code: |
      def selection_sort(items):
          items = items[:]
          for i in range(len(items)):
              smallest = i
              for j in range(i + 1, len(items)):
                  if items[j] < items[smallest]:
                      smallest = j
              items[i], items[smallest] = items[smallest], items[i]
          return items

      print(selection_sort([5, 2, 9, 1]))
    output: '[1, 2, 5, 9]'
    runnable: true
    caption:
      en: "`items[:]` makes a copy first, so the caller's list is left untouched."

  - type: text
    body:
      en: |
        In real code, use `sorted`. Its `key` argument takes a function that says **what** to
        sort by. With `key=len`, words are sorted by their length.

  - type: code
    code: |
      words = ["banana", "fig", "cherry"]
      print(sorted(words, key=len))
    output: "['fig', 'banana', 'cherry']"
    runnable: true
    caption:
      en: banana and cherry tie on length, so they keep their original order.

  - type: code
    code: |
      def age(person):
          return person[1]

      people = [("Ann", 31), ("Bo", 25), ("Cy", 40)]
      print(sorted(people, key=age))
    output: "[('Bo', 25), ('Ann', 31), ('Cy', 40)]"
    runnable: true

  - type: callout
    variant: note
    body:
      en: |
        `key` takes the function itself, without brackets: `key=len`, not `key=len()`.
        `sorted` calls it once for every item.

