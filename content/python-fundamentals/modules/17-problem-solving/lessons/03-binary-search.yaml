id: f7fee9c3-1b51-4e38-afee-b80392ff9c5b
slug: binary-search
title:
  en: Searching by halves
summary:
  en: Binary search on a sorted list, and why it needs so few checks.
estimated_minutes: 8
review_status: draft

blocks:
  - type: text
    body:
      en: |
        When a list is **sorted**, you can search it far faster. Look at the middle item. If
        the target is bigger, it can only be in the right half; if smaller, only in the left.
        Throw the other half away and repeat.

  - type: code
    code: |
      def binary_search(items, target):
          low = 0
          high = len(items) - 1
          while low <= high:
              mid = (low + high) // 2
              if items[mid] == target:
                  return mid
              elif items[mid] < target:
                  low = mid + 1
              else:
                  high = mid - 1
          return -1

      nums = [2, 5, 8, 12, 16, 23, 38]
      print(binary_search(nums, 23))
      print(binary_search(nums, 7))
    output: |-
      5
      -1
    runnable: true
    caption:
      en: '`low` and `high` mark the part of the list still worth searching.'

  - type: text
    body:
      en: |
        Every check halves what is left. A thousand items need at most about 10 checks; a
        million need about 20. A linear search of that million could need a million.

  - type: callout
    variant: mistake
    body:
      en: |
        Binary search only works on a sorted list. On an unsorted one it throws away halves
        that may hold the target, and reports "not found" for items that are there.

  - type: question
    question:
      id: 081e539c-bf6d-49ca-9903-7ff8888e30f3
      type: true_false
      difficulty: easy
      prompt:
        en: Binary search only works correctly on a sorted list.
      answer:
        value: true
      explanation:
        en: >
          Discarding half the list is only safe when the order tells you which half the
          target cannot be in.
      skill_tags: [searching]
      review_status: draft

  - type: question
    question:
      id: 408ff317-0f94-41f9-aaf1-0ed0df8af64b
      type: multiple_choice
      difficulty: easy
      prompt:
        en: What does each step of a binary search do to the part of the list still being searched?
      payload:
        options:
          - id: halves
            text:
              en: Halves it
          - id: one
            text:
              en: Removes one item
          - id: doubles
            text:
              en: Doubles it
          - id: sorts
            text:
              en: Sorts it
      answer:
        option_id: halves
      explanation:
        en: >
          Each comparison with the middle item rules out half of what is left. That is where
          the speed comes from.
      skill_tags: [searching]
      review_status: draft

  - type: question
    question:
      id: 7e4846a1-8a46-4082-98b8-eebb0c418137
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        def binary_search(items, target):
            low = 0
            high = len(items) - 1
            while low <= high:
                mid = (low + high) // 2
                if items[mid] == target:
                    return mid
                elif items[mid] < target:
                    low = mid + 1
                else:
                    high = mid - 1
            return -1

        print(binary_search([1, 3, 5, 7, 9], 3))
      payload:
        input: text
      answer:
        value: '1'
        match_mode: trimmed
      explanation:
        en: >
          The middle is 5, which is too big, so the search moves left to [1, 3]. The new
          middle is 1, too small, so it moves right and finds 3 at index 1.
      skill_tags: [searching]
      review_status: draft

  - type: question
    question:
      id: 170f6997-d041-4045-b622-5d3e8fe935b1
      type: multiple_choice
      difficulty: medium
      prompt:
        en: Roughly how many checks does binary search need, at most, for a sorted list of 1,000,000 items?
      payload:
        options:
          - id: twenty
            text:
              en: About 20
          - id: thousand
            text:
              en: About 1,000
          - id: half
            text:
              en: About 500,000
          - id: million
            text:
              en: About 1,000,000
      answer:
        option_id: twenty
      explanation:
        en: >
          Halving a million about 20 times brings it down to one item, because 2 to the power
          of 20 is just over a million.
      skill_tags: [searching, complexity]
      review_status: draft

  - type: question
    question:
      id: c2f2c3ff-78f6-4c77-b4a7-c286092caf1d
      type: predict_output
      difficulty: medium
      prompt:
        en: How many times can 1024 be halved before reaching 1? What does this print?
      code_snippet: |
        def steps(n):
            count = 0
            while n > 1:
                n = n // 2
                count += 1
            return count

        print(steps(1024))
      payload:
        input: text
      answer:
        value: '10'
        match_mode: trimmed
      explanation:
        en: >
          1024 is 2 to the power of 10, so it halves ten times. This count is exactly how many
          steps a binary search of 1024 items needs at most.
      skill_tags: [searching, complexity, loops]
      review_status: draft

  - type: question
    question:
      id: 7e2e57ce-4a3d-4743-8cba-97dd3162e7b8
      type: multiple_select
      difficulty: hard
      prompt:
        en: The binary search in this lesson expects smallest-first order. On which lists does it work correctly?
      payload:
        options:
          - id: squares
            text:
              en: '[1, 4, 9, 16]'
          - id: unsorted
            text:
              en: '[3, 1, 2]'
          - id: words
            text:
              en: '["ant", "bee", "cat"]'
          - id: repeats
            text:
              en: '[5, 5, 6, 8]'
          - id: descending
            text:
              en: '[10, 5, 1]'
      answer:
        option_ids: [squares, words, repeats]
      explanation:
        en: >
          Any list in smallest-first order works — including strings, which compare
          alphabetically, and repeated values. An unsorted list fails, and so does one sorted
          largest-first, because the search would throw away the wrong half.
      hint:
        en: Check each list is in smallest-first order.
      skill_tags: [searching, sorting]
      review_status: draft
