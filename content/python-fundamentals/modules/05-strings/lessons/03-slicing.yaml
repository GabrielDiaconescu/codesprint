id: 9a76c6fd-c3b6-44cf-8fca-e424ac03d8f9
slug: slicing
title:
  en: Cutting out a piece
summary:
  en: Slices with a start and a stop, leaving either side out, and stepping through a string.
estimated_minutes: 7
review_status: draft

blocks:
  - type: text
    body:
      en: |
        A **slice** takes a piece out of a string. `word[start:stop]` begins at `start` and
        goes up to — but not including — `stop`.

  - type: code
    code: |
      word = "Python"
      print(word[0:2])
      print(word[2:6])
    output: |-
      Py
      thon
    runnable: true
    caption:
      en: '`[0:2]` is positions 0 and 1. Position 2 is where the slice stops, so it is left out.'

  - type: text
    body:
      en: |
        Leave out the start to begin at the very beginning, or leave out the stop to run to
        the very end.

  - type: code
    code: |
      word = "Python"
      print(word[:3])
      print(word[3:])
    output: |-
      Pyt
      hon
    runnable: true

  - type: callout
    variant: tip
    body:
      en: |
        Because the stop is not included, `word[:3]` and `word[3:]` fit together perfectly
        with no overlap and no gap. Joined, they always give back the whole word.

  - type: text
    body:
      en: |
        A third number sets the **step**. A step of 2 takes every second character, and a step
        of -1 walks backwards — the shortest way to reverse a string.

  - type: code
    code: |
      word = "Python"
      print(word[::2])
      print(word[::-1])
    output: |-
      Pto
      nohtyP
    runnable: true

  - type: question
    question:
      id: b8306d93-0775-4853-b921-7209ec347066
      type: predict_output
      difficulty: easy
      prompt:
        en: What does this print?
      code_snippet: |
        print("Python"[0:3])
      payload:
        input: text
      answer:
        value: Pyt
        match_mode: trimmed
      explanation:
        en: >
          Positions 0, 1 and 2 — "P", "y" and "t". Position 3 is where the slice stops, so
          "h" is not included.
      skill_tags: [strings, slicing]
      review_status: draft

  - type: question
    question:
      id: 6bdeb65c-f9ce-47bd-9f44-4d594d4720bb
      type: true_false
      difficulty: easy
      prompt:
        en: In `word[2:5]`, the character at index 5 is included in the slice.
      answer:
        value: false
      explanation:
        en: >
          A slice runs up to the stop but not including it. `word[2:5]` gives the characters
          at positions 2, 3 and 4.
      skill_tags: [slicing]
      review_status: draft

  - type: question
    question:
      id: 7bb0e1df-b4e5-4338-98e7-26036ddee92c
      type: predict_output
      difficulty: medium
      prompt:
        en: What does this print?
      code_snippet: |
        print("abcdef"[2:])
      payload:
        input: text
      answer:
        value: cdef
        match_mode: trimmed
      explanation:
        en: >
          With no stop, the slice runs from index 2 to the end. Index 2 is "c", so the result
          is "cdef".
      skill_tags: [slicing]
      review_status: draft

  - type: question
    question:
      id: 1aa88729-d977-470d-af51-bd576a44facc
      type: multiple_choice
      difficulty: medium
      prompt:
        en: With `s = "hello"`, which slice gives `"ell"`?
      payload:
        options:
          - id: right
            text:
              en: s[1:4]
          - id: short
            text:
              en: s[1:3]
          - id: shifted
            text:
              en: s[2:4]
          - id: start
            text:
              en: s[0:3]
      answer:
        option_id: right
      explanation:
        en: >
          "ell" is at positions 1, 2 and 3. The stop has to be one past the last position you
          want, so the slice is `[1:4]`.
      hint:
        en: The stop is one past the last character you want.
      skill_tags: [slicing]
      review_status: draft

  - type: question
    question:
      id: 568f9101-7e51-443a-9048-ae3b71177ab9
      type: predict_output
      difficulty: hard
      prompt:
        en: What does this print?
      code_snippet: |
        print("abcdef"[1:5:2])
      payload:
        input: text
      answer:
        value: bd
        match_mode: trimmed
      explanation:
        en: >
          The slice starts at index 1 ("b"), stops before index 5, and moves two steps at a
          time: index 1, then 3. That gives "b" and "d". Index 5 would be next, but the slice
          stops before it.
      hint:
        en: List the indexes the slice visits, starting at 1 and adding 2 each time.
      skill_tags: [slicing]
      review_status: draft
