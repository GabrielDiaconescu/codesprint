name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          EXPO_PUBLIC_APP_ENV: development

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Proves migrations apply cleanly on a FRESH database every time — SPEC §54 requires
      # that, and it is the only way to catch a migration that only works incrementally.
      - name: Start Supabase and apply migrations
        run: npx supabase start

      # The RLS access matrix, the XP ledger invariants and the schema guarantees
      # (SPEC §40, §53). A regression here is a security regression.
      - name: pgTAP suite
        run: npx supabase test db

      - name: Fail if generated types are stale
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts src/types/database.types.ts > /dev/null; then
            echo "::error::src/types/database.types.ts is out of date. Run: npm run db:types"
            diff /tmp/database.types.ts src/types/database.types.ts || true
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  content:
    name: Content (validate + run on real Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # D9: every snippet must behave identically on both. The runner has neither by default,
      # and `verify_python.py` refuses to run rather than silently checking only one.
      - name: Install Python 3.12
        id: py312
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python 3.14
        id: py314
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Pointed at explicitly rather than trusting PATH order: installing two versions leaves
      # whichever ran last in front, and a silent fallback to one interpreter would defeat the
      # entire point of checking both. `verify_python.py` honours these overrides.
      - name: Point the verifier at both interpreters
        run: |
          echo "PYTHON_3_12=${{ steps.py312.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PYTHON_3_14=${{ steps.py314.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Schemas, unique ids, question counts, difficulty mix, placeholder text (SPEC §35.1).
      - name: Validate content
        run: npm run content:validate

      # The part that catches content which is well-formed but WRONG: a lesson claiming a
      # program prints 24 when it prints 25 (SPEC §35.2).
      - name: Run every snippet on both interpreters
        run: npm run content:verify

      # The seed is generated, never hand-written (SPEC §52). If it drifts from the content
      # files, local databases stop matching what the pipeline would publish.
      - name: Fail if supabase/seed.sql is stale
        run: |
          npm run content:seed
          if ! git diff --quiet -- supabase/seed.sql; then
            echo "::error::supabase/seed.sql is out of date. Run: npm run content:seed"
            git diff --stat -- supabase/seed.sql
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # SPEC §40: no secret may ever reach the repository.
      #
      # gitleaks is invoked directly rather than through gitleaks-action, which derives a
      # commit RANGE and so fails on the first push (the initial commit has no parent, making
      # `<sha>^..<sha>` an invalid revision). Scanning the full history is also strictly more
      # thorough: a secret committed and later removed still sits in history.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full repository history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
