# Changing the password inside the app — no email, no website (SPEC §29).
#
# The seeded Premium account: its onboarding is done by the fixtures and no other flow signs in
# with it. A wrong current password is refused first; then the password is changed, and the
# proof is signing out and back in with the new one. The next run's reset restores the old one.
appId: ${APP_ID}
name: Change the password in the app
tags:
  - account
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: premium@codesprint.test
      PASSWORD: ${DEV_PASSWORD}

- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: profile-change-password
    timeout: 20000
- tapOn:
    id: profile-change-password
- extendedWaitUntil:
    visible:
      id: change-password-current
    timeout: 10000

# A wrong current password changes nothing, and says why.
- tapOn:
    id: change-password-current
- inputText: not-my-password-1
- tapOn:
    id: change-password-new
- inputText: Sprint2027new
# "Go" on the new password submits the form.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: change-password-error
    timeout: 20000

# The right one.
- tapOn:
    id: change-password-current
- eraseText: 40
- inputText: ${DEV_PASSWORD}
- tapOn:
    id: change-password-new
- pressKey: Enter
- extendedWaitUntil:
    notVisible:
      id: change-password-sheet
    timeout: 20000

# Signing out and back in with the new password is the proof it changed.
- tapOn:
    id: profile-sign-out
- tapOn:
    id: sign-out-confirm
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 20000
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: premium@codesprint.test
      PASSWORD: Sprint2027new
